<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Accounts</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: { navy: '#0F172A', ink: '#1E293B', gold: '#0E7490', mist: '#F8FAFC' },
  fontFamily: { serif: ['Inter','Noto Sans Thai','sans-serif'], sans: ['Inter','Noto Sans Thai','sans-serif'] }
}}}
</script>
<style>@media (prefers-reduced-motion: reduce){*{transition:none!important}}h1,h2,h3,.font-serif{font-weight:300!important;letter-spacing:-0.02em}</style>
</head>
<body class="bg-mist text-ink font-sans antialiased min-h-screen">

<header class="bg-navy text-white">
  <div class="mx-auto max-w-[1400px] px-6 lg:px-10 py-4 flex items-center justify-between">
    <a href="index.html" class="font-serif text-xl cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-gold rounded">Meridian</a>
    <a href="index.html" class="text-sm text-slate-300 hover:text-white transition-colors duration-200 cursor-pointer">← กลับหน้าหลัก</a>
  </div>
</header>

<main class="mx-auto max-w-[1400px] px-6 lg:px-10 py-12">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-serif text-3xl text-navy">บัญชีลูกค้าองค์กร</h1>
      <p class="mt-1 text-slate-600" id="count" aria-live="polite"></p>
    </div>
    <div class="flex gap-3">
      <label for="q" class="sr-only">ค้นหา</label>
      <input id="q" type="search" placeholder="ค้นหาชื่อหรือภูมิภาค" class="w-64 rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">
      <label for="st" class="sr-only">สถานะ</label>
      <select id="st" class="rounded-full border border-slate-300 bg-white px-4 py-2.5 text-sm cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">
        <option value="">ทุกสถานะ</option><option>Active</option><option>Pending</option><option>Suspended</option>
      </select>
    </div>
  </div>

  <div class="mt-8 overflow-x-auto rounded-2xl border border-slate-200 bg-white">
    <table class="w-full text-sm text-left">
      <caption class="sr-only">รายชื่อบัญชีลูกค้าองค์กร เรียงลำดับได้</caption>
      <thead class="border-b border-slate-200 text-slate-600">
        <tr id="head"></tr>
      </thead>
      <tbody id="body" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>

  <div class="mt-6 flex items-center justify-between text-sm text-slate-600">
    <span id="page"></span>
    <div class="flex gap-2">
      <button id="prev" class="rounded-full border border-slate-300 bg-white px-5 py-2 hover:border-navy transition-colors duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">ก่อนหน้า</button>
      <button id="next" class="rounded-full border border-slate-300 bg-white px-5 py-2 hover:border-navy transition-colors duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-gold">ถัดไป</button>
    </div>
  </div>
</main>

<script>
const names = ['Siam Holdings','Aurora Logistics','Nordic Capital','Pacific Energy','Helix Biotech','Orion Retail','Vertex Bank','Atlas Mining','Lumen Media','Cobalt Systems','Zenith Airlines','Harbor Insurance','Summit Foods','Quartz Telecom','Elm Healthcare','Beacon Education'];
const regions = ['Bangkok','Singapore','Tokyo','London','Sydney'];
const statuses = ['Active','Active','Active','Pending','Suspended'];
const rows = names.map((n,i)=>({ name:n, region:regions[i%5], status:statuses[(i*3)%5], seats:200+((i*379)%4800), revenue:(i*173%900+120)*1000 }));
const cols = [['name','บริษัท'],['region','ภูมิภาค'],['status','สถานะ'],['seats','ผู้ใช้งาน'],['revenue','รายได้ (USD)']];
const badge = {Active:'bg-emerald-50 text-emerald-800 ring-emerald-200',Pending:'bg-amber-50 text-amber-800 ring-amber-200',Suspended:'bg-rose-50 text-rose-800 ring-rose-200'};
const PER = 8; let sort = ['name',1], page = 0;
const $ = id => document.getElementById(id);
const num = k => k==='seats'||k==='revenue';

$('head').innerHTML = cols.map(([k,l])=>`<th scope="col" class="px-6 py-4 font-medium ${num(k)?'text-right':''}" aria-sort="none" data-k="${k}">
  <button class="cursor-pointer hover:text-navy transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-gold rounded">${l} <span aria-hidden="true" class="text-gold"></span></button></th>`).join('');

function render(){
  const q = $('q').value.toLowerCase(), s = $('st').value;
  let d = rows.filter(r=>(!s||r.status===s)&&(r.name+r.region).toLowerCase().includes(q));
  d.sort((a,b)=>(a[sort[0]]>b[sort[0]]?1:-1)*sort[1]);
  const pages = Math.max(1,Math.ceil(d.length/PER)); page = Math.min(page,pages-1);
  $('body').innerHTML = d.slice(page*PER,page*PER+PER).map(r=>`<tr class="hover:bg-mist transition-colors duration-150">
    <th scope="row" class="px-6 py-4 font-medium text-navy">${r.name}</th>
    <td class="px-6 py-4 text-slate-600">${r.region}</td>
    <td class="px-6 py-4"><span class="inline-flex rounded-full px-3 py-1 text-xs font-medium ring-1 ring-inset ${badge[r.status]}">${r.status}</span></td>
    <td class="px-6 py-4 text-right tabular-nums">${r.seats.toLocaleString()}</td>
    <td class="px-6 py-4 text-right tabular-nums">${r.revenue.toLocaleString()}</td></tr>`).join('')
    || '<tr><td colspan="5" class="px-6 py-12 text-center text-slate-600">ไม่พบข้อมูล</td></tr>';
  $('count').textContent = `${d.length} รายการ`;
  $('page').textContent = `หน้า ${page+1} / ${pages}`;
  $('prev').disabled = page===0; $('next').disabled = page>=pages-1;
  document.querySelectorAll('#head th').forEach(th=>{
    const on = th.dataset.k===sort[0];
    th.setAttribute('aria-sort', on?(sort[1]>0?'ascending':'descending'):'none');
    th.querySelector('span').textContent = on?(sort[1]>0?'↑':'↓'):'';
  });
}
$('head').onclick = e=>{ const th=e.target.closest('th'); if(!th) return;
  sort = [th.dataset.k, sort[0]===th.dataset.k?-sort[1]:1]; render(); };
$('q').oninput = $('st').onchange = ()=>{ page=0; render(); };
$('prev').onclick = ()=>{ page--; render(); };
$('next').onclick = ()=>{ page++; render(); };
render();
</script>
</body>
</html>
