<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>License Grid — Softly</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#2563EB',soft:'#EFF6FF'},cta:{DEFAULT:'#C2410C',hover:'#9A3412'}},fontFamily:{sans:['Open Sans','sans-serif'],display:['Poppins','sans-serif']}}}}
</script>
<style>@media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
<header class="bg-white border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="index.html" class="font-display font-bold text-xl text-slate-900 cursor-pointer">Softly</a>
    <a href="index.html" class="text-sm font-semibold text-brand hover:underline min-h-[44px] inline-flex items-center">← Back to site</a>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="font-display font-semibold text-2xl sm:text-3xl text-slate-900">License inventory</h1>
      <p class="text-slate-600 mt-1">Track seats, renewals and spend across all purchased software.</p>
    </div>
    <button class="min-h-[44px] px-5 rounded-lg bg-cta hover:bg-cta-hover text-white text-sm font-semibold transition-colors duration-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cta">+ Add license</button>
  </div>

  <dl class="mt-6 grid grid-cols-2 lg:grid-cols-4 gap-4" id="kpi"></dl>

  <section class="mt-6 bg-white border border-slate-200 rounded-2xl overflow-hidden" aria-label="License table">
    <div class="p-4 flex flex-wrap gap-3 items-center border-b border-slate-200">
      <div class="flex-1 min-w-[200px]">
        <label for="q" class="sr-only">Search software or vendor</label>
        <input id="q" type="search" placeholder="Search software or vendor…" class="w-full min-h-[44px] rounded-lg border border-slate-300 px-3 focus:outline-none focus:ring-2 focus:ring-brand">
      </div>
      <div>
        <label for="st" class="sr-only">Filter by status</label>
        <select id="st" class="min-h-[44px] rounded-lg border border-slate-300 px-3 bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand">
          <option value="">All statuses</option><option>Active</option><option>Expiring</option><option>Expired</option>
        </select>
      </div>
      <div>
        <label for="vd" class="sr-only">Filter by vendor</label>
        <select id="vd" class="min-h-[44px] rounded-lg border border-slate-300 px-3 bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand"><option value="">All vendors</option></select>
      </div>
      <div>
        <label for="co" class="sr-only">Filter by annual cost</label>
        <select id="co" class="min-h-[44px] rounded-lg border border-slate-300 px-3 bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand">
          <option value="">Any cost</option><option value="0-20000">Under $20k</option><option value="20000-50000">$20k – $50k</option><option value="50000-1e9">Over $50k</option>
        </select>
      </div>
      <p id="sel" class="w-full text-sm text-slate-600" role="status"></p>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <caption class="sr-only">Software licenses with seats, status, renewal date and annual cost</caption>
        <thead class="bg-slate-50 text-slate-700">
          <tr id="head">
            <th scope="col" class="w-12 px-4"><input id="all" type="checkbox" aria-label="Select all rows on page" class="w-4 h-4 cursor-pointer accent-blue-600"></th>
          </tr>
        </thead>
        <tbody id="body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>

    <div class="p-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 text-sm text-slate-600">
      <p id="info" aria-live="polite"></p>
      <div class="flex gap-2">
        <button id="prev" class="min-h-[44px] px-4 rounded-lg border border-slate-300 font-semibold hover:border-brand hover:text-brand disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer transition-colors duration-200">Previous</button>
        <button id="next" class="min-h-[44px] px-4 rounded-lg border border-slate-300 font-semibold hover:border-brand hover:text-brand disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer transition-colors duration-200">Next</button>
      </div>
    </div>
  </section>
</main>

<script>
const names=[["Atlas IDE","Atlas Labs"],["Vaultwise","Vaultwise Inc"],["Ledgerly","Ledgerly"],["Pulse APM","Pulse Systems"],["Orbit CRM","Orbit"],["Nimbus Cloud","Nimbus"],["Sketchpad Pro","Sketchworks"],["Beacon BI","Beacon Data"],["Relay Chat","Relay"],["Guardian EDR","Guardian Sec"],["Forge CI","Forge"],["Docuflow","Docuflow"]];
const sts=["Active","Active","Expiring","Active","Expired"];
const rows=Array.from({length:36},(_,i)=>{const[n,v]=names[i%12];const d=new Date(2026,9+((i*5)%14)-3,1+(i*7)%28);
  return{id:i,name:n+(i>11?` ${Math.floor(i/12)+1}`:""),vendor:v,seats:20+(i*37)%480,used:0,status:sts[i%5],renew:d.toISOString().slice(0,10),cost:3000+(i*4137)%90000}});
rows.forEach(r=>r.used=Math.round(r.seats*(0.5+((r.id*13)%50)/100)));
const cols=[["name","Software"],["vendor","Vendor"],["seats","Seats used"],["status","Status"],["renew","Renewal"],["cost","Annual cost"]];
const badge={Active:"bg-green-100 text-green-800",Expiring:"bg-amber-100 text-amber-900",Expired:"bg-red-100 text-red-800"};
const $=id=>document.getElementById(id), usd=n=>"$"+n.toLocaleString("en-US");
let sort={k:"name",dir:1},page=0,size=8,picked=new Set(),view=[];

$("head").insertAdjacentHTML("beforeend",cols.map(([k,l])=>`<th scope="col" aria-sort="none" data-k="${k}" class="px-4 py-3 font-semibold ${k==="cost"||k==="seats"?"text-right":""}"><button class="inline-flex items-center gap-1 min-h-[44px] cursor-pointer hover:text-brand focus:outline-none focus-visible:ring-2 focus-visible:ring-brand rounded">${l}<span class="arr text-xs" aria-hidden="true"></span></button></th>`).join(""));

function render(){
  const q=$("q").value.toLowerCase(),s=$("st").value,v=$("vd").value,[lo,hi]=($("co").value||"0-1e12").split("-").map(Number);
  view=rows.filter(r=>(!s||r.status===s)&&(!v||r.vendor===v)&&r.cost>=lo&&r.cost<hi&&(r.name+r.vendor).toLowerCase().includes(q))
    .sort((a,b)=>(a[sort.k]>b[sort.k]?1:a[sort.k]<b[sort.k]?-1:0)*sort.dir);
  const pages=Math.max(1,Math.ceil(view.length/size));page=Math.min(page,pages-1);
  const slice=view.slice(page*size,page*size+size);
  $("body").innerHTML=slice.length?slice.map(r=>`<tr class="hover:bg-brand-soft transition-colors duration-150 ${picked.has(r.id)?"bg-brand-soft":""}">
    <td class="px-4"><input type="checkbox" data-id="${r.id}" aria-label="Select ${r.name}" ${picked.has(r.id)?"checked":""} class="w-4 h-4 cursor-pointer accent-blue-600"></td>
    <th scope="row" class="px-4 py-3 font-semibold text-slate-900">${r.name}</th>
    <td class="px-4 py-3 text-slate-700">${r.vendor}</td>
    <td class="px-4 py-3 text-right tabular-nums">${r.used}/${r.seats}</td>
    <td class="px-4 py-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badge[r.status]}">${r.status}</span></td>
    <td class="px-4 py-3 tabular-nums text-slate-700">${r.renew}</td>
    <td class="px-4 py-3 text-right tabular-nums font-semibold">${usd(r.cost)}</td></tr>`).join("")
    :`<tr><td colspan="7" class="px-4 py-12 text-center text-slate-600">No licenses match your filters.</td></tr>`;
  document.querySelectorAll("#head th[data-k]").forEach(th=>{const on=th.dataset.k===sort.k;
    th.setAttribute("aria-sort",on?(sort.dir>0?"ascending":"descending"):"none");th.querySelector(".arr").textContent=on?(sort.dir>0?"▲":"▼"):"";});
  $("info").textContent=view.length?`Showing ${page*size+1}–${page*size+slice.length} of ${view.length}`:"0 results";
  $("prev").disabled=page===0;$("next").disabled=page>=pages-1;
  $("sel").textContent=picked.size?`${picked.size} selected`:"";
  $("all").checked=slice.length>0&&slice.every(r=>picked.has(r.id));
  const tot=view.reduce((a,r)=>a+r.cost,0),seats=view.reduce((a,r)=>a+r.seats,0),used=view.reduce((a,r)=>a+r.used,0);
  $("kpi").innerHTML=[["Licenses",view.length],["Annual spend",usd(tot)],["Seat utilization",seats?Math.round(used/seats*100)+"%":"–"],["Expiring soon",view.filter(r=>r.status==="Expiring").length]]
    .map(([l,v])=>`<div class="bg-white border border-slate-200 rounded-xl p-5"><dt class="text-sm text-slate-600">${l}</dt><dd class="font-display font-semibold text-2xl text-slate-900">${v}</dd></div>`).join("");
}
$("head").onclick=e=>{const th=e.target.closest("th[data-k]");if(!th)return;const k=th.dataset.k;sort={k,dir:sort.k===k?-sort.dir:1};render()};
$("body").onchange=e=>{const id=+e.target.dataset.id;e.target.checked?picked.add(id):picked.delete(id);render()};
$("all").onchange=e=>{view.slice(page*size,page*size+size).forEach(r=>e.target.checked?picked.add(r.id):picked.delete(r.id));render()};
$("vd").insertAdjacentHTML("beforeend",[...new Set(rows.map(r=>r.vendor))].sort().map(v=>`<option>${v}</option>`).join(""));
$("q").oninput=$("st").onchange=$("vd").onchange=$("co").onchange=()=>{page=0;render()};
$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};
render();
</script>
</body>
</html>
